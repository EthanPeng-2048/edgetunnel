name = "v20251104"
main = "src/index.ts"
compatibility_date = "2025-11-04"
keep_vars = true

# 静态页面（login / admin / noADMIN / noKV）本地化：
# run_worker_first = true —— 路由与认证必须先经 Worker，未命中才落静态资源。
# 详见 DESIGN.md §7。
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

# KV 绑定：只声明 binding、不写 id（wrangler 自动预配，官方 GitHub 部署流做法）。
# 首次部署自动创建命名空间；id 不进仓库，在控制台「绑定」页可见（与上游同款：仓库无 id、资源归 dashboard 管）。
# 也可先在控制台手动添加 KV 绑定（变量名 KV，上游同款步骤），wrangler 部署时沿用同名绑定。
# 绑定名 KV 是兼容红线，勿改。
[[kv_namespaces]]
binding = "KV"
